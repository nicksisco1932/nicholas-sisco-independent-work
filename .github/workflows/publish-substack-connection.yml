name: Publish Substack links to existing Pages

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Publish only the reviewed Substack links on the accepted Pages baseline
        required: true
        type: choice
        options: [DO_NOT_PUBLISH, PUBLISH]
        default: DO_NOT_PUBLISH

permissions:
  contents: read

concurrency:
  group: github-pages-substack-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Accepted live release plus the two Substack link changes only.
          ref: 9daffe72b9872ebb79b8b6014c9f8ecbcdaadd35
          fetch-depth: 0
      - name: Verify exact release and bounded scope
        run: |
          test "$(git rev-parse HEAD)" = "9daffe72b9872ebb79b8b6014c9f8ecbcdaadd35"
          git diff --name-only 16b02c6810a1007607571b372b1f662f3c9944a9 HEAD > /tmp/actual-paths
          printf '%s\n' src/components/SiteFooter.astro src/pages/index.astro > /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Verify subscription links and preserve publication boundary
        run: |
          grep -F 'https://nicksisco.substack.com/subscribe' dist/index.html
          grep -F 'https://nicksisco.substack.com/subscribe' dist/the-price-of-the-exception.html
          test ! -e dist/the-decoys-have-job-titles-now.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
