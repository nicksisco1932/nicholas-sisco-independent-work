name: Publish GitHub Pages migration notices

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full main commit SHA to prepare as the legacy migration archive
        required: true
        type: string
      confirmation:
        description: Select PUBLISH only after the Cloudflare production site has passed live checks
        required: true
        type: choice
        options: [DO_NOT_PUBLISH, PUBLISH]
        default: DO_NOT_PUBLISH

permissions:
  contents: read

concurrency:
  group: github-pages-migration
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Verify selected commit is on main
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$COMMIT_SHA" origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require permanent production domain
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: node scripts/check-production-origin.mjs
      - name: Build and validate the legacy Pages source
        env:
          PUBLIC_SITE_BASE: /nicholas-sisco-independent-work
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: npm run validate
      - name: Prepare migration notices and the course export page
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: npm run prepare:legacy-migration
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./legacy-pages
      - uses: actions/deploy-pages@v5
