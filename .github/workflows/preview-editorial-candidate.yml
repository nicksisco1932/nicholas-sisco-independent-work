name: Preview editorial candidate

on:
  workflow_run:
    workflows: [Build editorial candidate]
    types: [requested, in_progress, completed]

permissions:
  contents: read

jobs:
  inactive:
    runs-on: ubuntu-latest
    steps:
      - name: Record disabled activation gate
        run: echo 'Review upload is disabled. Separate owner approval, Access bootstrap evidence, scoped credentials, and reviewed activation changes are required.' >> "$GITHUB_STEP_SUMMARY"

  preview:
    # Engineering-only PR: do not replace this literal gate until separately approved.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: editorial-review
    permissions:
      contents: read
      actions: read
      pull-requests: write
    concurrency:
      group: editorial-preview-receipt-${{ github.event.workflow_run.pull_requests[0].number || 'main' }}
      cancel-in-progress: false
      # Preserve completion events when status events arrive behind a running job.
      queue: max
    steps:
      - name: Require a pinned trusted checkout
        env:
          EDITORIAL_TRUSTED_SHA: ${{ vars.EDITORIAL_TRUSTED_SHA }}
        run: '[[ "$EDITORIAL_TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - name: Check out trusted tooling only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ vars.EDITORIAL_TRUSTED_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install trusted locked tooling without lifecycle hooks
        run: npm ci --ignore-scripts
      - name: Verify provenance, upload fixed review target, and update receipt
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          EDITORIAL_TRUSTED_SHA: ${{ vars.EDITORIAL_TRUSTED_SHA }}
          REVIEW_CLOUDFLARE_API_TOKEN: ${{ secrets.REVIEW_CLOUDFLARE_API_TOKEN }}
          CANDIDATE_RUN_ID: ${{ github.event.workflow_run.id }}
          CANDIDATE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CANDIDATE_EVENT_ACTION: ${{ github.event.action }}
        run: node scripts/editorial-control.mjs preview "$CANDIDATE_RUN_ID" "$CANDIDATE_RUN_ATTEMPT"
      - name: Preserve immutable private-preview evidence
        if: steps.preview.outputs.receipt_directory != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: .editorial/preview-receipt/receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          overwrite: false
      - name: Mark failed preview or receipt unavailable for this exact source
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          EDITORIAL_TRUSTED_SHA: ${{ vars.EDITORIAL_TRUSTED_SHA }}
          CANDIDATE_RUN_ID: ${{ github.event.workflow_run.id }}
          CANDIDATE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: node scripts/editorial-control.mjs preview-failure "$CANDIDATE_RUN_ID" "$CANDIDATE_RUN_ATTEMPT"
